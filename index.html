<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Effect + Drawing Mode</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
    opacity: 0; pointer-events: none;
  }
  #canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
  #ui { position: absolute; top: 16px; left: 16px; z-index: 10; pointer-events: none; }
  #status {
    font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 8px 16px; background: rgba(0,0,0,0.7);
    border-left: 3px solid #555; color: #aaa;
    transition: all 0.2s; backdrop-filter: blur(8px);
    border-radius: 0 8px 8px 0; font-weight: bold;
  }
  #status.active { color: #0f0; border-left-color: #0f0; }
  #status.gojo { color: #df00ff; border-left-color: #df00ff; animation: pulse 0.5s infinite alternate; }
  #status.drawing { color: #ffaa00; border-left-color: #ffaa00; background: rgba(0,0,0,0.8); }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

  /* Панель инструментов */
  .toolbar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    padding: 10px 20px;
    border-radius: 40px;
    display: flex;
    gap: 15px;
    z-index: 20;
    pointer-events: auto;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .tool-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 8px 20px;
    border-radius: 30px;
    color: white;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tool-btn.active {
    background: #ffaa00;
    color: #000;
    box-shadow: 0 0 15px rgba(255,170,0,0.5);
  }
  .tool-btn:hover { background: rgba(255,255,255,0.3); }
  .color-picker {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid white;
    cursor: pointer;
    background: #ff0000;
  }
  .clear-btn {
    background: rgba(255,50,50,0.3);
  }
  .clear-btn:hover { background: rgba(255,50,50,0.7); }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui"><div id="status">Starting...</div></div>
  <div class="toolbar">
    <button class="tool-btn" data-mode="effects">🎬 EFFECTS</button>
    <button class="tool-btn" data-mode="draw">✏️ DRAW</button>
    <input type="color" id="colorPicker" value="#ff0000" class="color-picker">
    <button class="tool-btn clear-btn" id="clearBtn">🗑️ CLEAR</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video    = document.getElementById("video");
const canvas   = document.getElementById("canvas");
const ctx      = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const colorPicker = document.getElementById("colorPicker");
const clearBtn = document.getElementById("clearBtn");

// ========== РЕЖИМЫ ==========
let appMode = "effects"; // "effects" или "draw"

// ========== ДЛЯ РИСОВАНИЯ ==========
let drawingEnabled = false;
let lastDrawX = null, lastDrawY = null;
let drawColor = "#ff0000";
const drawingCanvas = document.createElement("canvas");
let drawingCtx = null;

// ========== НАСТРОЙКИ ЖЕСТОВ ДЛЯ РИСОВАНИЯ ==========
// Жест 1: указательный вытянут → РИСОВАНИЕ
// Жест 2: указательный + средний вытянуты → ЛАСТИК
// Жест 3: все пальцы в кулак → стоп

const LERP           = 0.7;
const FADE_FRAMES    = 8;
const PINCH_THRESH   = 0.06;
const PINCH_COOLDOWN = 20;
const FIST_THRESH    = 0.12;
const FINGER_LERP    = 0.5;
const FINGER_TIPS    = [4, 8, 12, 16, 20];
const FINGER_NAMES   = ["T","I","M","R","P"];

const EFFECTS = ["none","posterize","threshold","pixelate","glitch","vhs","ascii","thermal"];
const LABELS  = {
  none:"NO EFFECT", posterize:"POSTERIZE", threshold:"THRESHOLD",
  pixelate:"PIXELATE", glitch:"GLITCH", vhs:"VHS", ascii:"ASCII", thermal:"THERMAL"
};

let currentEffect = 0;
let smoothPts     = null;
let lastPts       = null;
let lostFrames    = 0;
let pinchActive   = false;
let pinchCooldown = 0;
let cameraReady   = false;
let smoothLeftTips  = null;
let smoothRightTips = null;
let gojoActive    = false;
let gojoTimer     = 0;
let effectLabelTimer = 0;
let effectLabelText  = "";

// Чёрная дыра
let blackHoleActive = false;
let blackHoleTimer  = 0;
let blackHoleX      = 0;
let blackHoleY      = 0;
let blackHoleRadius = 0;
const BLACK_HOLE_DURATION = 60 * 9;
const HANDS_CLOSE_THRESH  = 0.15;
let handsCloseCooldown = 0;

// Glitch state
let glitchLines = [];
function randomGlitchLines(w, h) {
  const lines = [];
  const count = 8 + Math.floor(Math.random() * 12);
  for (let i = 0; i < count; i++) {
    lines.push({
      y:      Math.floor(Math.random() * h),
      height: 2 + Math.floor(Math.random() * 18),
      shift:  (Math.random() - 0.5) * 80,
      invert: Math.random() < 0.2,
    });
  }
  return lines;
}

const ASCII_CHARS = "@#W$9876543210?!abc;:+=-,._  ";
const glitchFrameBuffer = [];
const GLITCH_BUF_SIZE = 8;

// ========== ФУНКЦИИ РАСПОЗНАВАНИЯ ЖЕСТОВ ==========

function isFingerExtended(lm, tipIdx, pipIdx) {
  const wrist = lm[0];
  const tip   = lm[tipIdx];
  const pip   = lm[pipIdx];
  const dTip = Math.hypot(tip.x-wrist.x, tip.y-wrist.y);
  const dPip = Math.hypot(pip.x-wrist.x, pip.y-wrist.y);
  return dTip > dPip * 1.1;
}

function isFingerCurled(lm, tipIdx, pipIdx) {
  return !isFingerExtended(lm, tipIdx, pipIdx);
}

function isFist(lm) {
  const wrist = lm[0];
  const tips  = [8, 12, 16, 20];
  const bases = [5,  9, 13, 17];
  let curled = 0;
  for (let i=0; i<tips.length; i++) {
    const dTip  = Math.hypot(lm[tips[i]].x-wrist.x,  lm[tips[i]].y-wrist.y);
    const dBase = Math.hypot(lm[bases[i]].x-wrist.x, lm[bases[i]].y-wrist.y);
    if (dTip < dBase * 1.05) curled++;
  }
  const thumbTip  = lm[4];
  const thumbBase = lm[2];
  const indexBase = lm[5];
  const thumbCurled = Math.hypot(thumbTip.x-indexBase.x, thumbTip.y-indexBase.y) <
                      Math.hypot(thumbBase.x-indexBase.x, thumbBase.y-indexBase.y) * 1.2;
  return curled >= 4 && thumbCurled;
}

// Жест "пистолет" (только указательный вытянут)
function isPointGun(lm) {
  if (isFist(lm)) return false;
  const indexExt = isFingerExtended(lm, 8, 6);
  const middleCurled = isFingerCurled(lm, 12, 10);
  const ringCurled = isFingerCurled(lm, 16, 14);
  const pinkyCurled = isFingerCurled(lm, 20, 18);
  const thumbCurled = isFingerCurled(lm, 4, 2);
  return indexExt && middleCurled && ringCurled && pinkyCurled && thumbCurled;
}

// Жест "мир" (указательный + средний вытянуты)
function isPeaceSign(lm) {
  if (isFist(lm)) return false;
  const indexExt = isFingerExtended(lm, 8, 6);
  const middleExt = isFingerExtended(lm, 12, 10);
  const ringCurled = isFingerCurled(lm, 16, 14);
  const pinkyCurled = isFingerCurled(lm, 20, 18);
  const thumbCurled = isFingerCurled(lm, 4, 2);
  return indexExt && middleExt && ringCurled && pinkyCurled && thumbCurled;
}

// ========== ФУНКЦИИ РИСОВАНИЯ ==========

function initDrawingCanvas() {
  drawingCanvas.width = canvas.width;
  drawingCanvas.height = canvas.height;
  drawingCtx = drawingCanvas.getContext("2d");
  drawingCtx.strokeStyle = drawColor;
  drawingCtx.lineWidth = 8;
  drawingCtx.lineCap = "round";
  drawingCtx.lineJoin = "round";
}

function startDrawing(x, y) {
  drawingEnabled = true;
  lastDrawX = x;
  lastDrawY = y;
  drawingCtx.beginPath();
  drawingCtx.moveTo(x, y);
}

function draw(x, y) {
  if (!drawingEnabled) return;
  if (lastDrawX && lastDrawY) {
    drawingCtx.beginPath();
    drawingCtx.moveTo(lastDrawX, lastDrawY);
    drawingCtx.lineTo(x, y);
    drawingCtx.stroke();
  }
  lastDrawX = x;
  lastDrawY = y;
}

function stopDrawing() {
  drawingEnabled = false;
  lastDrawX = null;
  lastDrawY = null;
}

function erase(x, y) {
  drawingCtx.globalCompositeOperation = "destination-out";
  drawingCtx.beginPath();
  drawingCtx.arc(x, y, 20, 0, Math.PI * 2);
  drawingCtx.fill();
  drawingCtx.globalCompositeOperation = "source-over";
}

// ========== ЭФФЕКТЫ (все из твоего кода) ==========

function applyPosterize(d, m) {
  const step = 255 / 3;
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      d[i]   = Math.round(Math.round(d[i]   / step) * step);
      d[i+1] = Math.round(Math.round(d[i+1] / step) * step);
      d[i+2] = Math.round(Math.round(d[i+2] / step) * step);
    }
  }
}

function applyThreshold(d, m) {
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
      const v = g > 128 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = v;
    }
  }
}

function applyPixelate(d, m, w, h) {
  const block = 12;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      if (m[(y*w+x)*4] <= 128) continue;
      const cx = Math.min(x+block/2, w-1);
      const cy = Math.min(y+block/2, h-1);
      const si = (Math.floor(cy)*w+Math.floor(cx))*4;
      const r=d[si],g=d[si+1],b=d[si+2];
      for (let dy=0; dy<block&&y+dy<h; dy++)
        for (let dx=0; dx<block&&x+dx<w; dx++) {
          const pi=((y+dy)*w+(x+dx))*4;
          if(m[pi]>128){d[pi]=r;d[pi+1]=g;d[pi+2]=b;}
        }
    }
  }
}

function applyGlitch(d, m, w, h) {
  const copy = new Uint8ClampedArray(d);
  glitchFrameBuffer.push(copy);
  if (glitchFrameBuffer.length > GLITCH_BUF_SIZE) glitchFrameBuffer.shift();
  if (glitchFrameBuffer.length > 2 && Math.random() < 0.6) {
    const oldFrame = glitchFrameBuffer[Math.floor(Math.random() * glitchFrameBuffer.length)];
    for (let i = 0; i < d.length; i += 4) {
      if (m[i] <= 128) continue;
      d[i]=oldFrame[i]; d[i+1]=oldFrame[i+1]; d[i+2]=oldFrame[i+2];
    }
  }
  const rgbShift = 15 + Math.floor(Math.random() * 40);
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] <= 128) continue;
    const x = (i/4) % w;
    const y = Math.floor((i/4) / w);
    const ri = (y*w + Math.min(x+rgbShift, w-1))*4;
    const bi = (y*w + Math.max(x-rgbShift, 0))*4;
    if (m[ri]>128) d[i]   = d[ri];
    if (m[bi]>128) d[i+2] = d[bi];
    if (Math.random()<0.3) d[i+1] = Math.min(255, d[i+1]+80);
  }
  glitchLines = randomGlitchLines(w, h);
  glitchLines.forEach(line => {
    const colorHit = Math.random();
    for (let row = line.y; row < Math.min(line.y+line.height, h); row++) {
      for (let x = 0; x < w; x++) {
        const srcX = Math.max(0, Math.min(w-1, x + line.shift));
        const si = (row*w + Math.floor(srcX))*4;
        const di = (row*w + x)*4;
        if (m[di]<=128||m[si]<=128) continue;
        if (line.invert) {
          d[di]=255-d[si]; d[di+1]=255-d[si+1]; d[di+2]=255-d[si+2];
        } else {
          d[di]=d[si]; d[di+1]=d[si+1]; d[di+2]=d[si+2];
        }
        if (colorHit < 0.3)      d[di]   = Math.min(255, d[di]+150);
        else if (colorHit < 0.6) d[di+1] = Math.min(255, d[di+1]+150);
        else                     d[di+2] = Math.min(255, d[di+2]+150);
      }
    }
  });
}

function applyVHS(d, m, w, h) {
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] <= 128) continue;
    const noise = (Math.random()-0.5)*30;
    d[i]   = Math.min(255, Math.max(0, d[i]   * 0.85 + 30 + noise));
    d[i+1] = Math.min(255, Math.max(0, d[i+1] * 0.80 + 20 + noise));
    d[i+2] = Math.min(255, Math.max(0, d[i+2] * 0.65 + 10 + noise));
  }
  const lineCount = 3 + Math.floor(Math.random()*4);
  for (let l=0; l<lineCount; l++) {
    const ly = Math.floor(Math.random()*h);
    const shift = (Math.random()-0.5)*20;
    for (let x=0; x<w; x++) {
      const si = (ly*w + Math.max(0,Math.min(w-1,Math.floor(x+shift))))*4;
      const di = (ly*w+x)*4;
      if (m[di]>128&&m[si]>128){d[di]=d[si];d[di+1]=d[si+1];d[di+2]=d[si+2];}
    }
  }
}

function applyASCII(pts) {
  const minX = Math.min(...pts.map(p=>p.x));
  const maxX = Math.max(...pts.map(p=>p.x));
  const minY = Math.min(...pts.map(p=>p.y));
  const maxY = Math.max(...pts.map(p=>p.y));
  const charW = 8, charH = 12;
  const regionW = Math.max(1, Math.floor(maxX-minX));
  const regionH = Math.max(1, Math.floor(maxY-minY));
  const imgData = ctx.getImageData(minX, minY, regionW, regionH);
  const d = imgData.data;
  ctx.fillStyle="#000";
  ctx.fillRect(minX, minY, regionW, regionH);
  ctx.font = `${charH}px monospace`;
  ctx.textBaseline = "top";
  for (let y=0; y<regionH; y+=charH) {
    for (let x=0; x<regionW; x+=charW) {
      const pi=(y*regionW+x)*4;
      const brightness = (d[pi]*0.299 + d[pi+1]*0.587 + d[pi+2]*0.114) / 255;
      const charIdx = Math.floor(brightness * (ASCII_CHARS.length-1));
      const ch = ASCII_CHARS[charIdx];
      const g = Math.floor(brightness*200+55);
      ctx.fillStyle = `rgb(${g},${Math.floor(g*0.9)},${Math.floor(g*0.5)})`;
      ctx.fillText(ch, minX+x, minY+y);
    }
  }
}

function applyThermal(d, m) {
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] <= 128) continue;
    const brightness = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) / 255;
    let r, g, b;
    if (brightness < 0.2) {
      const t = brightness/0.2;
      r=0; g=0; b=Math.floor(128+127*t);
    } else if (brightness < 0.4) {
      const t=(brightness-0.2)/0.2;
      r=0; g=Math.floor(255*t); b=255;
    } else if (brightness < 0.6) {
      const t=(brightness-0.4)/0.2;
      r=0; g=255; b=Math.floor(255*(1-t));
    } else if (brightness < 0.8) {
      const t=(brightness-0.6)/0.2;
      r=Math.floor(255*t); g=255; b=0;
    } else {
      const t=(brightness-0.8)/0.2;
      r=255; g=Math.floor(255*(1-t)); b=0;
    }
    d[i]=r; d[i+1]=g; d[i+2]=b;
  }
}

function detectGojo(lm) {
  const pinkyUp = isFingerExtended(lm, 20, 18);
  const ringUp  = isFingerExtended(lm, 16, 14);
  const midDown = isFingerCurled(lm, 12, 10);
  const idxDown = isFingerCurled(lm, 8, 6);
  return pinkyUp && ringUp && midDown && idxDown;
}

// ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========

function getLm(lm, idx, w, h) {
  return { x: (1-lm[idx].x)*w, y: lm[idx].y*h };
}

function getLmRaw(lm, idx) {
  return { x: lm[idx].x, y: lm[idx].y };
}

function dist(a, b) { return Math.hypot(a.x-b.x, a.y-b.y); }

function getAllFingerTips(lm, w, h) {
  return FINGER_TIPS.map(idx => ({
    idx, x:(1-lm[idx].x)*w, y:lm[idx].y*h
  }));
}

function smoothTips(cur, tgt) {
  if (!cur) return tgt;
  return tgt.map((t,i)=>({
    idx:t.idx,
    x:cur[i].x*(1-FINGER_LERP)+t.x*FINGER_LERP,
    y:cur[i].y*(1-FINGER_LERP)+t.y*FINGER_LERP,
  }));
}

function drawJoints(lm, color, w, h) {
  const conn=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
              [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
              [0,17],[17,18],[18,19],[19,20]];
  ctx.strokeStyle=color; ctx.lineWidth=1.5;
  conn.forEach(([a,b])=>{
    const p1=getLm(lm,a,w,h), p2=getLm(lm,b,w,h);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  });
}

function drawTips(tips, color) {
  tips.forEach((t,i)=>{
    ctx.beginPath(); ctx.arc(t.x,t.y,6,0,Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="bold 9px monospace";
    ctx.fillText(FINGER_NAMES[i], t.x-4, t.y-8);
  });
}

function lerpPt(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
function lerpPts(cur,tgt,t){return cur.map((p,i)=>lerpPt(p,tgt[i],t));}

function buildMask(pts) {
  const w=canvas.width, h=canvas.height;
  const off=document.createElement("canvas"); off.width=w; off.height=h;
  const c=off.getContext("2d");
  c.fillStyle="#fff";
  c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>c.lineTo(p.x,p.y));
  c.closePath(); c.fill();
  return c.getImageData(0,0,w,h).data;
}

function getRotatedRect(lThumb, lIndex, rThumb, rIndex) {
  const lCenter = { x:(lThumb.x+lIndex.x)/2, y:(lThumb.y+lIndex.y)/2 };
  const rCenter = { x:(rThumb.x+rIndex.x)/2, y:(rThumb.y+rIndex.y)/2 };
  const lDx = Math.abs(lThumb.x - lIndex.x);
  const lDy = Math.abs(lThumb.y - lIndex.y);
  const rDx = Math.abs(rThumb.x - rIndex.x);
  const rDy = Math.abs(rThumb.y - rIndex.y);
  const halfW = dist(lCenter, rCenter)/2 + (lDx+rDx)/2 * 1.5;
  const halfH = (lDy+rDy)/2 * 2.5 + 40;
  const angle = Math.atan2(rCenter.y-lCenter.y, rCenter.x-lCenter.x);
  const cx = (lCenter.x+rCenter.x)/2;
  const cy = (lCenter.y+rCenter.y)/2;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return [
    { x: cx - cos*halfW + sin*halfH, y: cy - sin*halfW - cos*halfH },
    { x: cx + cos*halfW + sin*halfH, y: cy + sin*halfW - cos*halfH },
    { x: cx + cos*halfW - sin*halfH, y: cy + sin*halfW + cos*halfH },
    { x: cx - cos*halfW - sin*halfH, y: cy - sin*halfW + cos*halfH },
  ];
}

function drawOverlay(pts, gojo) {
  const color = gojo ? "rgba(180,0,255,0.95)" : "rgba(255,255,255,0.9)";
  ctx.strokeStyle=color; ctx.lineWidth=3;
  if (gojo) { ctx.shadowBlur=20; ctx.shadowColor="#df00ff"; }
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur=0;
  pts.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2);
    ctx.fillStyle=gojo?"rgba(180,0,255,0.8)":"rgba(0,200,255,0.7)";
    ctx.fill(); ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke();
  });
}

function drawEffectLabel(pts) {
  if (effectLabelTimer <= 0) return;
  effectLabelTimer--;
  const cx = pts.reduce((s,p)=>s+p.x,0)/pts.length;
  const cy = pts.reduce((s,p)=>s+p.y,0)/pts.length;
  const alpha = Math.min(1, effectLabelTimer/20);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "bold 28px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.strokeStyle="#000"; ctx.lineWidth=4;
  ctx.strokeText(effectLabelText, cx, cy);
  ctx.fillStyle="#fff";
  ctx.fillText(effectLabelText, cx, cy);
  ctx.restore();
}

// ========== ЧЁРНАЯ ДЫРА ==========
const _bhParticles = Array.from({length: 280}, () => ({
  angle: Math.random() * Math.PI * 2,
  dist:  0.9 + Math.random() * 2.2,
  speed: 0.005 + Math.random() * 0.016,
  alpha: 0.3 + Math.random() * 0.7,
  size:  0.4 + Math.random() * 1.8,
  r: 220 + Math.floor(Math.random() * 35),
  g:  90 + Math.floor(Math.random() * 110),
  b:   5 + Math.floor(Math.random() * 55),
}));

function drawBlackHole(x, y, progress) {
  const r = blackHoleRadius;
  const t = Date.now() / 1000;
  if (r < 2) return;
  ctx.save();
  const glow = ctx.createRadialGradient(x, y, r*0.8, x, y, r*7);
  glow.addColorStop(0,   `rgba(255,150,40,${0.14*progress})`);
  glow.addColorStop(0.3, `rgba(180,70,10,${0.07*progress})`);
  glow.addColorStop(0.7, `rgba(60,15,0,${0.03*progress})`);
  glow.addColorStop(1,   "rgba(0,0,0,0)");
  ctx.beginPath(); ctx.arc(x, y, r*7, 0, Math.PI*2);
  ctx.fillStyle = glow; ctx.fill();
  ctx.save(); ctx.translate(x, y);
  for (let i = 9; i >= 1; i--) {
    const rx = r * (1.2 + i * 0.30);
    const ry = rx * 0.10;
    const alpha = (i / 9) * 0.92 * progress;
    const gr = ctx.createLinearGradient(-rx, 0, rx, 0);
    gr.addColorStop(0,    `rgba(255,250,210,${alpha})`);
    gr.addColorStop(0.12, `rgba(255,220,140,${alpha*0.95})`);
    gr.addColorStop(0.28, `rgba(255,170,50,${alpha*0.82})`);
    gr.addColorStop(0.48, `rgba(230,90,10,${alpha*0.52})`);
    gr.addColorStop(0.68, `rgba(150,38,0,${alpha*0.25})`);
    gr.addColorStop(0.88, `rgba(75,12,0,${alpha*0.10})`);
    gr.addColorStop(1,    `rgba(30,3,0,${alpha*0.03})`);
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.translate(x, y);
  for (let i = 6; i >= 1; i--) {
    const rx = r * (1.10 + i * 0.10);
    const ry = rx * 0.32;
    const alpha = (i / 6) * 0.58 * progress;
    const grTop = ctx.createLinearGradient(-rx, 0, rx, 0);
    grTop.addColorStop(0,   `rgba(255,215,110,${alpha})`);
    grTop.addColorStop(0.38,`rgba(235,105,18,${alpha*0.52})`);
    grTop.addColorStop(1,   `rgba(70,14,0,${alpha*0.10})`);
    ctx.beginPath(); ctx.ellipse(0, -r*0.07, rx, ry, 0, Math.PI, Math.PI*2);
    ctx.fillStyle = grTop; ctx.fill();
  }
  ctx.restore();
  _bhParticles.forEach(p => {
    p.angle += p.speed * (1 + 0.5 / p.dist);
    p.dist  -= 0.0025;
    if (p.dist < 0.80) {
      p.dist  = 1.8 + Math.random() * 1.6;
      p.angle = Math.random() * Math.PI * 2;
    }
    const px = x + Math.cos(p.angle) * p.dist * r;
    const py = y + Math.sin(p.angle) * p.dist * r * 0.10;
    const fade = Math.min(1, (p.dist - 0.80) * 3);
    const doppler = 0.55 + 0.45 * Math.cos(p.angle);
    ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${p.r},${Math.floor(p.g*doppler)},${Math.floor(p.b*0.4)},${p.alpha*fade*progress*0.7})`;
    ctx.fill();
  });
  const shadow = ctx.createRadialGradient(x-r*0.20, y-r*0.15, r*0.04, x, y, r);
  shadow.addColorStop(0,    "rgba(8,4,1,1)");
  shadow.addColorStop(0.55, "rgba(2,1,0,1)");
  shadow.addColorStop(1,    "rgba(0,0,0,1)");
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = shadow; ctx.fill();
  ctx.restore();
}

// ========== ГЛАВНЫЙ CALLBACK ==========

function onResults(results) {
  if (!cameraReady) return;
  const w=canvas.width, h=canvas.height;
  if (!w||!h) return;

  ctx.save(); ctx.scale(-1,1); ctx.drawImage(results.image,-w,0,w,h); ctx.restore();

  // Отрисовка рисунков поверх видео (если есть drawingCanvas)
  if (drawingCtx && drawingCanvas.width === w && drawingCanvas.height === h) {
    ctx.drawImage(drawingCanvas, 0, 0);
  }

  const hands=results.multiHandLandmarks;
  const handedness=results.multiHandedness;

  let leftHand=null, rightHand=null;
  if (hands&&hands.length>=1) {
    for (let i=0;i<hands.length;i++) {
      if (handedness[i].label==="Right") rightHand=hands[i];
      else                               leftHand=hands[i];
    }
  }

  // ========== РЕЖИМ РИСОВАНИЯ ==========
  if (appMode === "draw" && rightHand) {
    const tipIndex = getLm(rightHand, 8, w, h);
    const x = tipIndex.x;
    const y = tipIndex.y;
    
    const isGun = isPointGun(rightHand);
    const isPeace = isPeaceSign(rightHand);
    const isAllFist = isFist(rightHand);
    
    if (isGun && !isAllFist) {
      if (!drawingEnabled) startDrawing(x, y);
      else draw(x, y);
      statusEl.textContent = "✏️ DRAWING...";
      statusEl.className = "drawing";
    } 
    else if (isPeace && !isAllFist) {
      erase(x, y);
      if (drawingEnabled) stopDrawing();
      statusEl.textContent = "🧽 ERASER...";
      statusEl.className = "drawing";
    }
    else {
      if (drawingEnabled) stopDrawing();
      if (!isAllFist) {
        statusEl.textContent = "✏️ DRAW MODE — point gun to draw, peace to erase";
        statusEl.className = "drawing";
      } else {
        statusEl.textContent = "✏️ DRAW MODE — make a gesture";
        statusEl.className = "drawing";
      }
    }
    
    // В режиме рисования не показываем AR эффекты
    if (smoothPts) drawOverlay(smoothPts, false);
    return;
  } else if (appMode === "draw" && !rightHand) {
    if (drawingEnabled) stopDrawing();
    statusEl.textContent = "✏️ DRAW MODE — show RIGHT hand";
    statusEl.className = "drawing";
    return;
  }

  // ========== РЕЖИМ ЭФФЕКТОВ (весь твой старый код) ==========
  
  // Скелеты
  if (leftHand) {
    drawJoints(leftHand,"rgba(0,200,255,0.35)",w,h);
    const raw=getAllFingerTips(leftHand,w,h);
    smoothLeftTips=smoothTips(smoothLeftTips,raw);
    drawTips(smoothLeftTips,"rgba(0,200,255,0.9)");
  } else smoothLeftTips=null;

  if (rightHand) {
    drawJoints(rightHand,"rgba(255,100,150,0.35)",w,h);
    const raw=getAllFingerTips(rightHand,w,h);
    smoothRightTips=smoothTips(smoothRightTips,raw);
    drawTips(smoothRightTips,"rgba(255,100,150,0.9)");
  } else smoothRightTips=null;

  // Годжо
  const gojoLeft  = leftHand  ? detectGojo(leftHand)  : false;
  const gojoRight = rightHand ? detectGojo(rightHand) : false;
  if (gojoLeft && gojoRight) {
    gojoActive = true;
    gojoTimer  = 60;
  } else if (gojoTimer > 0) {
    gojoTimer--;
    if (gojoTimer === 0) gojoActive = false;
  }

  // Чёрная дыра
  if (leftHand && rightHand && !blackHoleActive) {
    const lWrist = getLmRaw(leftHand,  0);
    const rWrist = getLmRaw(rightHand, 0);
    const handsDist = Math.hypot(lWrist.x-rWrist.x, lWrist.y-rWrist.y);
    if (handsCloseCooldown > 0) handsCloseCooldown--;
    if (handsDist < HANDS_CLOSE_THRESH && handsCloseCooldown === 0) {
      blackHoleActive = true;
      blackHoleTimer  = BLACK_HOLE_DURATION;
      handsCloseCooldown = BLACK_HOLE_DURATION + 60;
      const lW = getLm(leftHand,  0, w, h);
      const rW = getLm(rightHand, 0, w, h);
      blackHoleX = (lW.x + rW.x) / 2;
      blackHoleY = (lW.y + rW.y) / 2;
      blackHoleRadius = 0;
    }
  }

  if (blackHoleActive) {
    blackHoleTimer--;
    const progress = blackHoleTimer / BLACK_HOLE_DURATION;
    if (progress > 0.8) {
      blackHoleRadius = (1 - progress) / 0.2 * 100;
    } else if (progress > 0.15) {
      blackHoleRadius = 100;
    } else {
      blackHoleRadius = progress / 0.15 * 100;
    }
    if (blackHoleTimer <= 0) blackHoleActive = false;
  }

  // Маска и эффекты
  if (leftHand && rightHand) {
    const lThumb=getLm(leftHand,4,w,h), lIndex=getLm(leftHand,8,w,h);
    const rThumb=getLm(rightHand,4,w,h), rIndex=getLm(rightHand,8,w,h);

    const lFist=isFist(leftHand);
    const rFist=isFist(rightHand);
    const anyFist=lFist&&rFist;

    if (pinchCooldown>0) pinchCooldown--;
    if (anyFist&&!pinchActive&&pinchCooldown===0) {
      currentEffect=(currentEffect+1)%EFFECTS.length;
      pinchActive=true; pinchCooldown=PINCH_COOLDOWN;
      effectLabelText=LABELS[EFFECTS[currentEffect]];
      effectLabelTimer=40;
    } else if (!anyFist) pinchActive=false;

    const target=getRotatedRect(lThumb,lIndex,rThumb,rIndex);
    lostFrames=0;
    smoothPts=smoothPts?lerpPts(smoothPts,target,LERP):target;
    lastPts=[...smoothPts];

    const eff=EFFECTS[currentEffect];
    if (gojoActive) {
      statusEl.textContent="∞ MURASAKI — HOLLOW PURPLE";
      statusEl.className="gojo";
    } else {
      statusEl.textContent=LABELS[eff]+(anyFist?" [FIST]":"");
      statusEl.className=eff!=="none"?"active":"";
    }

  } else if (leftHand||rightHand) {
    const hand=leftHand||rightHand;
    const thumb=getLm(hand,4,w,h), index=getLm(hand,8,w,h);
    const cx=(thumb.x+index.x)/2, cy=(thumb.y+index.y)/2;

    const oneFist=isFist(hand);
    if (pinchCooldown>0) pinchCooldown--;
    if (oneFist&&!pinchActive&&pinchCooldown===0) {
      currentEffect=(currentEffect+1)%EFFECTS.length;
      pinchActive=true; pinchCooldown=PINCH_COOLDOWN;
      effectLabelText=LABELS[EFFECTS[currentEffect]];
      effectLabelTimer=40;
    } else if (!oneFist) pinchActive=false;

    const handOpen = isOpenHand(hand);
    const dx=Math.abs(thumb.x-index.x);
    const dy=Math.abs(thumb.y-index.y);
    const halfW = handOpen ? w*0.45 : dx*2.5+60;
    const halfH = handOpen ? h*0.45 : dy*2.5+60;
    const target=[
      {x:cx-halfW,y:cy-halfH},{x:cx+halfW,y:cy-halfH},
      {x:cx+halfW,y:cy+halfH},{x:cx-halfW,y:cy+halfH}
    ];
    lostFrames=0;
    smoothPts=smoothPts?lerpPts(smoothPts,target,LERP):target;
    lastPts=[...smoothPts];
    const eff=EFFECTS[currentEffect];
    statusEl.textContent="ONE HAND: "+LABELS[eff]+(oneFist?" [FIST]":"");
    statusEl.className=eff!=="none"?"active":"";
  } else {
    lostFrames++;
    if (lostFrames<FADE_FRAMES&&lastPts) smoothPts=lastPts;
    else { smoothPts=null; lastPts=null; }
    statusEl.textContent="Show both hands";
    statusEl.className="";
  }

  // Чёрная дыра рендер
  if (blackHoleActive) {
    const progress = blackHoleTimer / BLACK_HOLE_DURATION;
    drawBlackHole(blackHoleX, blackHoleY, progress);
  }

  const eff=EFFECTS[currentEffect];
  if (smoothPts) {
    if (gojoActive) {
      const mask=buildMask(smoothPts);
      const imageData=ctx.getImageData(0,0,w,h);
      const d=imageData.data;
      for (let i=0;i<d.length;i+=4) {
        if (mask[i]>128) {
          d[i]   = Math.min(255, d[i]*0.3   + 120);
          d[i+1] = Math.min(255, d[i+1]*0.1 + 0);
          d[i+2] = Math.min(255, d[i+2]*0.5 + 180);
        }
      }
      ctx.putImageData(imageData,0,0);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(smoothPts[0].x,smoothPts[0].y);
      smoothPts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.closePath();
      ctx.fillStyle="rgba(180,0,255,0.15)";
      ctx.shadowBlur=40; ctx.shadowColor="#df00ff";
      ctx.fill(); ctx.restore();

    } else if (eff!=="none") {
      if (eff==="ascii") {
        applyASCII(smoothPts);
      } else {
        const imageData=ctx.getImageData(0,0,w,h);
        const mask=buildMask(smoothPts);
        if (eff==="posterize") applyPosterize(imageData.data,mask);
        if (eff==="threshold") applyThreshold(imageData.data,mask);
        if (eff==="pixelate")  applyPixelate(imageData.data,mask,w,h);
        if (eff==="glitch")    applyGlitch(imageData.data,mask,w,h);
        if (eff==="vhs")       applyVHS(imageData.data,mask,w,h);
        if (eff==="thermal")   applyThermal(imageData.data,mask);
        ctx.putImageData(imageData,0,0);
      }
    }
    drawOverlay(smoothPts, gojoActive);
    drawEffectLabel(smoothPts);
  }
}

function isOpenHand(lm) {
  const wrist = lm[0];
  const tips  = [4, 8, 12, 16, 20];
  const bases = [2, 5,  9, 13, 17];
  let extended = 0;
  for (let i=0; i<tips.length; i++) {
    const dTip  = Math.hypot(lm[tips[i]].x-wrist.x,  lm[tips[i]].y-wrist.y);
    const dBase = Math.hypot(lm[bases[i]].x-wrist.x, lm[bases[i]].y-wrist.y);
    if (dTip > dBase * 1.15) extended++;
  }
  return extended >= 4;
}

// ========== ИНИЦИАЛИЗАЦИЯ ==========

const handsDetector=new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
handsDetector.setOptions({
  maxNumHands:2, modelComplexity:1,
  minDetectionConfidence:0.5, minTrackingConfidence:0.5,
});
handsDetector.onResults(onResults);

async function startCamera() {
  try {
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream;
    return new Promise(resolve=>{
      video.onloadedmetadata=()=>{
        video.play().then(()=>{
          const check=setInterval(()=>{
            if(video.videoWidth>0){
              clearInterval(check);
              canvas.width=video.videoWidth;
              canvas.height=video.videoHeight;
              initDrawingCanvas();
              cameraReady=true;
              statusEl.textContent="Show both hands";
              resolve();
            }
          },100);
        });
      };
    });
  } catch(e) { statusEl.textContent="Camera error: "+e.message; }
}

async function loop() {
  if(cameraReady&&video.readyState>=2) {
    if(video.videoWidth!==canvas.width&&video.videoWidth>0){
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      initDrawingCanvas();
    }
    await handsDetector.send({image:video});
  }
  requestAnimationFrame(loop);
}

// Кнопки
document.querySelectorAll("[data-mode]").forEach(btn => {
  btn.addEventListener("click", () => {
    appMode = btn.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (appMode === "draw") {
      statusEl.textContent = "✏️ DRAW MODE — show RIGHT hand";
    } else {
      statusEl.textContent = "🎬 EFFECTS MODE — show both hands";
    }
    // Сбрасываем рисование при переключении
    if (drawingEnabled) stopDrawing();
  });
});

colorPicker.addEventListener("input", (e) => {
  drawColor = e.target.value;
  if (drawingCtx) {
    drawingCtx.strokeStyle = drawColor;
  }
});

clearBtn.addEventListener("click", () => {
  if (drawingCtx) {
    drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
  }
});

document.querySelector("[data-mode='effects']").classList.add("active");

startCamera().then(()=>loop());
</script>
