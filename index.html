<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Effect — Fixed Hand Tracking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    pointer-events: none;
  }
  #canvas {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #ui {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 10;
    pointer-events: none;
  }
  #status {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 16px;
    background: rgba(0,0,0,0.7);
    border-left: 3px solid #555;
    color: #aaa;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    border-radius: 0 8px 8px 0;
    font-weight: bold;
    pointer-events: none;
  }
  #status.active { color: #0f0; border-left-color: #0f0; }
  #status.pinch { background: rgba(0,255,0,0.2); color: #fff; }
  
  #mode-badge {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 10px;
    color: #888;
    font-family: monospace;
    backdrop-filter: blur(4px);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="status">🔍 Starting camera...</div>
  </div>
  <div id="mode-badge">🖐️ TWO HAND MODE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video    = document.getElementById("video");
const canvas   = document.getElementById("canvas");
const ctx      = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const modeBadge = document.getElementById("mode-badge");

const LERP         = 0.7;
const FADE_FRAMES  = 8;
const PINCH_THRESH = 0.06;
const PINCH_COOLDOWN = 20;

const EFFECTS = ["none", "posterize", "threshold", "pixelate"];
const LABELS  = {
  none:      "✨ NO EFFECT",
  posterize: "🎨 POSTERIZE",
  threshold: "⚫ THRESHOLD",
  pixelate:  "🔲 PIXELATE",
};

let currentEffect = 0;
let smoothPts  = null;
let lastPts    = null;
let lostFrames = 0;
let pinchActive   = false;
let pinchCooldown = 0;
let cameraReady = false;
let animationRunning = true;

// Режимы
let trackingMode = "two";

// Для плавного трекинга
let smoothLeftTips = null;
let smoothRightTips = null;
let smoothSingleTips = null;
const FINGER_LERP = 0.5;

const FINGER_TIPS = [4, 8, 12, 16, 20];
const FINGER_NAMES = ["THUMB", "INDEX", "MIDDLE", "RING", "PINKY"];

// ─────────────────────────────────────────────────────────────
// Эффекты
// ─────────────────────────────────────────────────────────────

function applyPosterize(d, m) {
  const levels = 4;
  const step = 255 / (levels - 1);
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      d[i]   = Math.round(Math.round(d[i]   / step) * step);
      d[i+1] = Math.round(Math.round(d[i+1] / step) * step);
      d[i+2] = Math.round(Math.round(d[i+2] / step) * step);
    }
  }
}

function applyThreshold(d, m) {
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
      const val  = gray > 128 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = val;
    }
  }
}

function applyPixelate(d, m, w, h) {
  const block = 12;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      const ci = (y * w + x) * 4;
      if (m[ci] <= 128) continue;
      const cx = Math.min(x + block / 2, w - 1);
      const cy = Math.min(y + block / 2, h - 1);
      const si = (Math.floor(cy) * w + Math.floor(cx)) * 4;
      const r = d[si], g = d[si+1], b = d[si+2];
      for (let dy = 0; dy < block && y+dy < h; dy++) {
        for (let dx = 0; dx < block && x+dx < w; dx++) {
          const pi = ((y+dy)*w + (x+dx))*4;
          if (m[pi] > 128) { d[pi]=r; d[pi+1]=g; d[pi+2]=b; }
        }
      }
    }
  }
}

// ─────────────────────────────────────────────────────────────
// Вспомогательные функции
// ─────────────────────────────────────────────────────────────

function getLm(lm, idx, w, h) {
  return { x: lm[idx].x * w, y: lm[idx].y * h };
}

function getLmRaw(lm, idx) {
  return { x: lm[idx].x, y: lm[idx].y };
}

function getAllFingerTips(handLandmarks, w, h) {
  return FINGER_TIPS.map(idx => ({
    idx: idx,
    x: handLandmarks[idx].x * w,
    y: handLandmarks[idx].y * h,
    rawX: handLandmarks[idx].x,
    rawY: handLandmarks[idx].y
  }));
}

function smoothFingerTips(current, target) {
  if (!current) return target;
  return target.map((t, i) => ({
    idx: t.idx,
    x: current[i].x * (1 - FINGER_LERP) + t.x * FINGER_LERP,
    y: current[i].y * (1 - FINGER_LERP) + t.y * FINGER_LERP,
    rawX: t.rawX,
    rawY: t.rawY
  }));
}

function drawFingerTips(handData, color, w, h, handName) {
  if (!handData) return;
  
  handData.forEach((tip, i) => {
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.fillStyle = "white";
    ctx.font = "bold 9px monospace";
    ctx.shadowBlur = 0;
    ctx.fillText(FINGER_NAMES[i][0], tip.x - 4, tip.y - 6);
  });
}

function drawAllHandJoints(hand, color, w, h) {
  const connections = [
    [0,1], [1,2], [2,3], [3,4],
    [0,5], [5,6], [6,7], [7,8],
    [0,9], [9,10], [10,11], [11,12],
    [0,13], [13,14], [14,15], [15,16],
    [0,17], [17,18], [18,19], [19,20]
  ];
  
  connections.forEach(conn => {
    const p1 = getLm(hand, conn[0], w, h);
    const p2 = getLm(hand, conn[1], w, h);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// РАСШИРЕННАЯ МАСКА - захватывает всю область между пальцами
function getExpandedMaskPoints(thumb, index, w, h) {
  // Центр между большим и указательным
  const centerX = (thumb.x + index.x) / 2;
  const centerY = (thumb.y + index.y) / 2;
  
  // Расстояние между пальцами
  const fingerDist = dist(thumb, index);
  
  // Размер маски в 3-4 раза больше расстояния между пальцами
  const expansionFactor = 3.5;
  const width = fingerDist * expansionFactor;
  const height = fingerDist * expansionFactor;
  
  // Возвращаем 4 точки прямоугольника (расширенная маска)
  return [
    { x: centerX - width, y: centerY - height },  // лево-верх
    { x: centerX + width, y: centerY - height },  // право-верх
    { x: centerX + width, y: centerY + height },  // право-низ
    { x: centerX - width, y: centerY + height }   // лево-низ
  ];
}

function lerpPt(a, b, t) {
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function lerpPts(cur, tgt, t) {
  if (!cur || cur.length !== tgt.length) return tgt;
  return cur.map((p, i) => lerpPt(p, tgt[i], t));
}

function buildMask(pts) {
  const w = canvas.width, h = canvas.height;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const c = off.getContext("2d");
  c.fillStyle = "#fff";
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => c.lineTo(p.x, p.y));
  c.closePath();
  c.fill();
  return c.getImageData(0, 0, w, h).data;
}

function drawOverlay(pts) {
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.closePath();
  ctx.stroke();
  
  // Рисуем круги на углах маски
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 200, 255, 0.7)";
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// ─────────────────────────────────────────────────────────────
// MediaPipe callback — ИСПРАВЛЕНА ИНВЕРСИЯ
// ─────────────────────────────────────────────────────────────

function onResults(results) {
  if (!cameraReady) return;
  
  const w = canvas.width;
  const h = canvas.height;
  if (w === 0 || h === 0) return;

  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -w, 0, w, h);
  ctx.restore();

  const hands = results.multiHandLandmarks;
  const handedness = results.multiHandedness;
  
  let leftHand = null;
  let rightHand = null;

  // ИСПРАВЛЕНИЕ: используем handedness от MediaPipe, но с учётом зеркала
  if (hands && hands.length >= 2) {
    for (let i = 0; i < hands.length; i++) {
      const label = handedness[i].label;
      if (label === "Left") {
        rightHand = hands[i]; // из-за зеркала Left от MediaPipe = правая рука на экране
      } else if (label === "Right") {
        leftHand = hands[i];  // из-за зеркала Right от MediaPipe = левая рука на экране
      }
    }
  } else if (hands && hands.length === 1) {
    // Для одной руки - определяем по положению на экране
    const handX = hands[0][0].x;
    if (handX < 0.5) {
      leftHand = hands[0];  // слева на экране
    } else {
      rightHand = hands[0]; // справа на экране
    }
  }

  // Авто-переключение режима
  if (leftHand && rightHand && trackingMode !== "two") {
    trackingMode = "two";
    modeBadge.innerHTML = "🖐️ TWO HAND MODE";
    modeBadge.style.color = "#888";
    statusEl.textContent = "✌️ Show both hands";
  } else if ((leftHand || rightHand) && !(leftHand && rightHand) && trackingMode !== "single") {
    trackingMode = "single";
    modeBadge.innerHTML = "🖐️ SINGLE HAND MODE";
    modeBadge.style.color = "#0f0";
  }

  // ========== ТРЕКИНГ И ОТРИСОВКА ПАЛЬЦЕВ ==========
  
  if (leftHand) {
    drawAllHandJoints(leftHand, "rgba(0, 200, 255, 0.3)", w, h);
    const rawTips = getAllFingerTips(leftHand, w, h);
    smoothLeftTips = smoothFingerTips(smoothLeftTips, rawTips);
    drawFingerTips(smoothLeftTips, "rgba(0, 200, 255, 0.9)", w, h, "L");
  }
  
  if (rightHand) {
    drawAllHandJoints(rightHand, "rgba(255, 100, 150, 0.3)", w, h);
    const rawTips = getAllFingerTips(rightHand, w, h);
    smoothRightTips = smoothFingerTips(smoothRightTips, rawTips);
    drawFingerTips(smoothRightTips, "rgba(255, 100, 150, 0.9)", w, h, "R");
  }

  // ========== МАСКА И ЭФФЕКТЫ ==========
  
  if (trackingMode === "two" && leftHand && rightHand) {
    // Берём большой и указательный с КАЖДОЙ руки
    const leftThumb = getLm(leftHand, 4, w, h);
    const leftIndex = getLm(leftHand, 8, w, h);
    const rightThumb = getLm(rightHand, 4, w, h);
    const rightIndex = getLm(rightHand, 8, w, h);
    
    // Проверка щипка (исправлено: каждая рука отвечает за себя)
    const leftPinchRaw = dist(getLmRaw(leftHand, 4), getLmRaw(leftHand, 8)) < PINCH_THRESH;
    const rightPinchRaw = dist(getLmRaw(rightHand, 4), getLmRaw(rightHand, 8)) < PINCH_THRESH;
    const bothPinch = leftPinchRaw && rightPinchRaw;

    if (pinchCooldown > 0) pinchCooldown--;

    if (bothPinch && !pinchActive && pinchCooldown === 0) {
      currentEffect = (currentEffect + 1) % EFFECTS.length;
      pinchActive = true;
      pinchCooldown = PINCH_COOLDOWN;
      statusEl.style.transform = "scale(1.05)";
      setTimeout(() => { statusEl.style.transform = ""; }, 150);
    } else if (!bothPinch) {
      pinchActive = false;
    }

    // РАСШИРЕННАЯ МАСКА для каждой руки
    const leftMask = getExpandedMaskPoints(leftThumb, leftIndex, w, h);
    const rightMask = getExpandedMaskPoints(rightThumb, rightIndex, w, h);
    
    // Объединяем маски (берём bounding box вокруг обеих)
    const allPoints = [...leftMask, ...rightMask];
    const minX = Math.min(...allPoints.map(p => p.x));
    const maxX = Math.max(...allPoints.map(p => p.x));
    const minY = Math.min(...allPoints.map(p => p.y));
    const maxY = Math.max(...allPoints.map(p => p.y));
    
    const target = [
      { x: minX, y: minY },
      { x: maxX, y: minY },
      { x: maxX, y: maxY },
      { x: minX, y: maxY }
    ];

    lostFrames = 0;
    smoothPts = smoothPts ? lerpPts(smoothPts, target, LERP) : target;
    lastPts = [...smoothPts];

    const eff = EFFECTS[currentEffect];
    statusEl.textContent = LABELS[eff] + (bothPinch ? " 🤏" : " 👌");
    statusEl.className = eff !== "none" ? "active" : "";
    if (bothPinch) statusEl.classList.add("pinch");
    else statusEl.classList.remove("pinch");

  } else if (trackingMode === "single") {
    // Режим одной руки - берём ту которая есть
    const activeHand = leftHand || rightHand;
    if (activeHand) {
      const thumb = getLm(activeHand, 4, w, h);
      const index = getLm(activeHand, 8, w, h);
      
      // Расширенная маска для одной руки
      const target = getExpandedMaskPoints(thumb, index, w, h);
      
      lostFrames = 0;
      smoothPts = smoothPts ? lerpPts(smoothPts, target, LERP) : target;
      lastPts = [...smoothPts];
      
      statusEl.textContent = "🖐️ ONE HAND — show two hands for effects";
      statusEl.className = "";
    } else {
      lostFrames++;
      if (lostFrames < FADE_FRAMES && lastPts) {
        smoothPts = lastPts;
      } else {
        smoothPts = null;
        lastPts = null;
      }
      statusEl.textContent = "🖐️ Show ONE hand";
      statusEl.className = "";
    }
  } else {
    lostFrames++;
    if (lostFrames < FADE_FRAMES && lastPts) {
      smoothPts = lastPts;
    } else {
      smoothPts = null;
      lastPts = null;
    }
    statusEl.textContent = "✌️ Show both hands";
    statusEl.className = "";
  }

  // Применяем эффект
  const eff = EFFECTS[currentEffect];
  if (smoothPts && eff !== "none") {
    const imageData = ctx.getImageData(0, 0, w, h);
    const mask = buildMask(smoothPts);

    if (eff === "posterize") applyPosterize(imageData.data, mask);
    if (eff === "threshold") applyThreshold(imageData.data, mask);
    if (eff === "pixelate") applyPixelate(imageData.data, mask, w, h);

    ctx.putImageData(imageData, 0, 0);
    drawOverlay(smoothPts);
  } else if (smoothPts) {
    drawOverlay(smoothPts);
  }
}

// ─────────────────────────────────────────────────────────────
// Инициализация
// ─────────────────────────────────────────────────────────────

const handsDetector = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

handsDetector.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5,
});

handsDetector.onResults(onResults);

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    video.srcObject = stream;
    
    return new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play().then(() => {
          const checkReady = setInterval(() => {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
              clearInterval(checkReady);
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              cameraReady = true;
              statusEl.textContent = "✌️ Show both hands";
              console.log(`✅ Camera ready: ${canvas.width}x${canvas.height}`);
              resolve();
            }
          }, 100);
        });
      };
    });
  } catch (e) {
    console.error("Camera error:", e);
    statusEl.textContent = "❌ Camera error: " + e.message;
    alert("Camera error: " + e.message);
  }
}

async function loop() {
  if (!animationRunning) return;
  
  if (cameraReady && video.readyState >= 2) {
    if (video.videoWidth !== canvas.width && video.videoWidth > 0) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      console.log(`🔄 Canvas resized to ${canvas.width}x${canvas.height}`);
    }
    await handsDetector.send({ image: video });
  }
  requestAnimationFrame(loop);
}

startCamera().then(() => {
  loop();
}).catch(e => {
  console.error("Start failed:", e);
});

window.addEventListener("beforeunload", () => {
  animationRunning = false;
  if (video.srcObject) {
    const tracks = video.srcObject.getTracks();
    tracks.forEach(track => track.stop());
  }
});
</script>
</body>
</html>
