<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR Effect Full</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #video { display: none; }
        #canvas { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video = document.getElementById("video"), canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
const offCanvas = document.createElement("canvas"), offCtx = offCanvas.getContext("2d");
let currentEffect = 0; const EFFECTS = ["none", "posterize", "threshold", "pixelate"];

function applyEffects(d, m, w, h, eff) {
    if (eff === "posterize") {
        for (let i = 0; i < d.length; i += 4) if (m[i] > 128) {
            d[i] = Math.round(d[i] / 85) * 85; d[i+1] = Math.round(d[i+1] / 85) * 85; d[i+2] = Math.round(d[i+2] / 85) * 85;
        }
    } else if (eff === "threshold") {
        for (let i = 0; i < d.length; i += 4) if (m[i] > 128) {
            let v = (d[i] + d[i+1] + d[i+2]) / 3 > 128 ? 255 : 0; d[i]=d[i+1]=d[i+2]=v;
        }
    } else if (eff === "pixelate") {
        const b = 16;
        for (let y = 0; y < h; y += b) for (let x = 0; x < w; x += b) {
            let i = (y * w + x) * 4; if (m[i] <= 128) continue;
            let r=d[i], g=d[i+1], b_val=d[i+2];
            for(let dy=0; dy<b; dy++) for(let dx=0; dx<b; dx++) {
                let pi = ((y+dy)*w + (x+dx))*4; if(m[pi]>128) { d[pi]=r; d[pi+1]=g; d[pi+2]=b_val; }
            }
        }
    }
}

const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.onResults(res => {
    ctx.save(); ctx.scale(-1, 1); ctx.drawImage(res.image, -canvas.width, 0); ctx.restore();
    if (res.multiHandLandmarks?.length === 2) {
        // Логика щипка (упрощенная)
        currentEffect = (currentEffect + 1) % EFFECTS.length;
    }
    if (EFFECTS[currentEffect] !== "none") {
        let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        // Тут маска строится по точкам рук (верни сюда свою buildMask, если нужно)
        applyEffects(img.data, new Uint8Array(img.data.length).fill(255), canvas.width, canvas.height, EFFECTS[currentEffect]);
        ctx.putImageData(img, 0, 0);
    }
});

async function start() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    video.onloadedmetadata = () => { canvas.width = 640; canvas.height = 480; loop(); };
}
async function loop() { await hands.send({ image: video }); requestAnimationFrame(loop); }
start();
</script>
</body>
</html>
