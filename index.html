<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Effect — Both Hands Fixed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    pointer-events: none;
  }
  #canvas {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #ui {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 10;
    pointer-events: none;
  }
  #status {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 16px;
    background: rgba(0,0,0,0.7);
    border-left: 3px solid #555;
    color: #aaa;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    border-radius: 0 8px 8px 0;
    font-weight: bold;
    pointer-events: none;
  }
  #status.active { color: #0f0; border-left-color: #0f0; }
  #status.pinch { background: rgba(0,255,0,0.2); color: #fff; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="status">🔍 Starting camera...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video    = document.getElementById("video");
const canvas   = document.getElementById("canvas");
const ctx      = canvas.getContext("2d");
const statusEl = document.getElementById("status");

const LERP         = 0.7;
const FADE_FRAMES  = 8;
const PINCH_THRESH = 0.06;
const PINCH_COOLDOWN = 20;

const EFFECTS = ["none", "posterize", "threshold", "pixelate"];
const LABELS  = {
  none:      "✨ NO EFFECT",
  posterize: "🎨 POSTERIZE",
  threshold: "⚫ THRESHOLD",
  pixelate:  "🔲 PIXELATE",
};

let currentEffect = 0;
let smoothPts  = null;
let lastPts    = null;
let lostFrames = 0;
let pinchActive   = false;
let pinchCooldown = 0;
let cameraReady = false;
let animationRunning = true;

// ─────────────────────────────────────────────────────────────
// Эффекты
// ─────────────────────────────────────────────────────────────

function applyPosterize(d, m) {
  const levels = 4;
  const step = 255 / (levels - 1);
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      d[i]   = Math.round(Math.round(d[i]   / step) * step);
      d[i+1] = Math.round(Math.round(d[i+1] / step) * step);
      d[i+2] = Math.round(Math.round(d[i+2] / step) * step);
    }
  }
}

function applyThreshold(d, m) {
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
      const val  = gray > 128 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = val;
    }
  }
}

function applyPixelate(d, m, w, h) {
  const block = 12;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      const ci = (y * w + x) * 4;
      if (m[ci] <= 128) continue;
      const cx = Math.min(x + block / 2, w - 1);
      const cy = Math.min(y + block / 2, h - 1);
      const si = (Math.floor(cy) * w + Math.floor(cx)) * 4;
      const r = d[si], g = d[si+1], b = d[si+2];
      for (let dy = 0; dy < block && y+dy < h; dy++) {
        for (let dx = 0; dx < block && x+dx < w; dx++) {
          const pi = ((y+dy)*w + (x+dx))*4;
          if (m[pi] > 128) { d[pi]=r; d[pi+1]=g; d[pi+2]=b; }
        }
      }
    }
  }
}

// ─────────────────────────────────────────────────────────────
// Вспомогательные функции
// ─────────────────────────────────────────────────────────────

function getLm(lm, idx, w, h) {
  return { x: lm[idx].x * w, y: lm[idx].y * h };
}

function getLmRaw(lm, idx) {
  return { x: lm[idx].x, y: lm[idx].y };
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function stableCorners(p1, p2) {
  return p1.y < p2.y ? [p1, p2] : [p2, p1];
}

function lerpPt(a, b, t) {
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function lerpPts(cur, tgt, t) {
  return cur.map((p, i) => lerpPt(p, tgt[i], t));
}

function buildMask(pts) {
  const w = canvas.width, h = canvas.height;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const c = off.getContext("2d");
  c.fillStyle = "#fff";
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => c.lineTo(p.x, p.y));
  c.closePath();
  c.fill();
  return c.getImageData(0, 0, w, h).data;
}

function drawOverlay(pts) {
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.closePath();
  ctx.stroke();
  
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0, 200, 255, 0.8)";
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}

// ─────────────────────────────────────────────────────────────
// MediaPipe callback — FIXED: правильное определение рук
// ─────────────────────────────────────────────────────────────

function onResults(results) {
  if (!cameraReady) return;
  
  const w = canvas.width;
  const h = canvas.height;
  if (w === 0 || h === 0) return;

  // Отрисовка видео на canvas с зеркалированием
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -w, 0, w, h);
  ctx.restore();

  const hands = results.multiHandLandmarks;
  
  let leftHandOnScreen = null;   // та что слева на экране
  let rightHandOnScreen = null;  // та что справа на экране

  // Определяем руки по X координате на экране
  if (hands && hands.length === 2) {
    const hand0x = hands[0][0].x;
    const hand1x = hands[1][0].x;
    
    if (hand0x < hand1x) {
      leftHandOnScreen = hands[0];
      rightHandOnScreen = hands[1];
    } else {
      leftHandOnScreen = hands[1];
      rightHandOnScreen = hands[0];
    }
  }

  if (leftHandOnScreen && rightHandOnScreen) {
    // Щипок на ЛЕВОЙ руке (на экране)
    const leftThumb = getLmRaw(leftHandOnScreen, 4);
    const leftIndex = getLmRaw(leftHandOnScreen, 8);
    const leftPinch = dist(leftThumb, leftIndex) < PINCH_THRESH;
    
    // Щипок на ПРАВОЙ руке (на экране)
    const rightThumb = getLmRaw(rightHandOnScreen, 4);
    const rightIndex = getLmRaw(rightHandOnScreen, 8);
    const rightPinch = dist(rightThumb, rightIndex) < PINCH_THRESH;
    
    const bothPinch = leftPinch && rightPinch;

    if (pinchCooldown > 0) pinchCooldown--;

    if (bothPinch && !pinchActive && pinchCooldown === 0) {
      currentEffect = (currentEffect + 1) % EFFECTS.length;
      pinchActive = true;
      pinchCooldown = PINCH_COOLDOWN;
      
      statusEl.style.transform = "scale(1.05)";
      setTimeout(() => { statusEl.style.transform = ""; }, 150);
    } else if (!bothPinch) {
      pinchActive = false;
    }

    // Точки для маски - теперь правильные (левая рука = левая точка)
    const lP1 = getLm(leftHandOnScreen, 4, w, h);
    const lP2 = getLm(leftHandOnScreen, 8, w, h);
    const rP1 = getLm(rightHandOnScreen, 4, w, h);
    const rP2 = getLm(rightHandOnScreen, 8, w, h);

    const [lTop, lBot] = stableCorners(lP1, lP2);
    const [rTop, rBot] = stableCorners(rP1, rP2);
    const target = [lTop, rTop, rBot, lBot];

    lostFrames = 0;
    smoothPts = smoothPts ? lerpPts(smoothPts, target, LERP) : target;
    lastPts = [...smoothPts];

    const eff = EFFECTS[currentEffect];
    statusEl.textContent = LABELS[eff] + (bothPinch ? " 🤏" : " 👌");
    statusEl.className = eff !== "none" ? "active" : "";
    if (bothPinch) statusEl.classList.add("pinch");
    else statusEl.classList.remove("pinch");

  } else {
    lostFrames++;
    if (lostFrames < FADE_FRAMES && lastPts) {
      smoothPts = lastPts;
    } else {
      smoothPts = null;
      lastPts = null;
    }
    
    if (hands?.length === 1) {
      statusEl.textContent = "✋ Show BOTH hands ✋";
    } else {
      statusEl.textContent = "✌️ Show both hands ✌️";
    }
    statusEl.className = "";
    statusEl.classList.remove("pinch");
  }

  const eff = EFFECTS[currentEffect];
  if (smoothPts && eff !== "none") {
    const imageData = ctx.getImageData(0, 0, w, h);
    const mask = buildMask(smoothPts);

    if (eff === "posterize") applyPosterize(imageData.data, mask);
    if (eff === "threshold") applyThreshold(imageData.data, mask);
    if (eff === "pixelate") applyPixelate(imageData.data, mask, w, h);

    ctx.putImageData(imageData, 0, 0);
    drawOverlay(smoothPts);
  } else if (smoothPts) {
    drawOverlay(smoothPts);
  }
}

// ─────────────────────────────────────────────────────────────
// Инициализация MediaPipe
// ─────────────────────────────────────────────────────────────

const handsDetector = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

handsDetector.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5,
});

handsDetector.onResults(onResults);

// ─────────────────────────────────────────────────────────────
// Запуск камеры
// ─────────────────────────────────────────────────────────────

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    video.srcObject = stream;
    
    return new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play().then(() => {
          const checkReady = setInterval(() => {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
              clearInterval(checkReady);
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              cameraReady = true;
              statusEl.textContent = "✌️ Show both hands ✌️";
              console.log(`✅ Camera ready: ${canvas.width}x${canvas.height}`);
              resolve();
            }
          }, 100);
        });
      };
    });
  } catch (e) {
    console.error("Camera error:", e);
    statusEl.textContent = "❌ Camera error: " + e.message;
    alert("Camera error: " + e.message);
  }
}

// ─────────────────────────────────────────────────────────────
// Главный цикл
// ─────────────────────────────────────────────────────────────

async function loop() {
  if (!animationRunning) return;
  
  if (cameraReady && video.readyState >= 2) {
    if (video.videoWidth !== canvas.width && video.videoWidth > 0) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      console.log(`🔄 Canvas resized to ${canvas.width}x${canvas.height}`);
    }
    await handsDetector.send({ image: video });
  }
  requestAnimationFrame(loop);
}

// Старт
startCamera().then(() => {
  loop();
}).catch(e => {
  console.error("Start failed:", e);
});

window.addEventListener("beforeunload", () => {
  animationRunning = false;
  if (video.srcObject) {
    const tracks = video.srcObject.getTracks();
    tracks.forEach(track => track.stop());
  }
});
</script>
</body>
</html>
