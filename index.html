<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
  }
  #canvas {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #ui {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tag {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-left: 2px solid #444;
    color: #666;
    background: rgba(0,0,0,0.5);
    transition: color 0.2s, border-color 0.2s;
  }
  .tag.on { color: #fff; border-left-color: #fff; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div class="tag" id="t1">Thumb+Index — Posterize</div>
    <div class="tag" id="t2">Index+Middle — Threshold</div>
    <div class="tag" id="t3">Ring+Pinky — Pixelate</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video  = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");

const LERP        = 0.4;
const FADE_FRAMES = 8;

// Три независимых состояния
const effects = [
  { id: "t1", smooth: null, last: null, lost: 0, fingers: [4, 8],   fn: posterize },
  { id: "t2", smooth: null, last: null, lost: 0, fingers: [8, 12],  fn: threshold },
  { id: "t3", smooth: null, last: null, lost: 0, fingers: [16, 20], fn: pixelate  },
];

// ── Эффекты ──────────────────────────────────────────

function posterize(imageData, maskData) {
  const d = imageData.data;
  const m = maskData.data;
  const levels = 4;
  const step = 255 / (levels - 1);
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      d[i]   = Math.round(Math.round(d[i]   / step) * step);
      d[i+1] = Math.round(Math.round(d[i+1] / step) * step);
      d[i+2] = Math.round(Math.round(d[i+2] / step) * step);
    }
  }
}

function threshold(imageData, maskData) {
  const d = imageData.data;
  const m = maskData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
      const val  = gray > 128 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = val;
    }
  }
}

function pixelate(imageData, maskData) {
  const d = imageData.data;
  const m = maskData.data;
  const w = canvas.width;
  const h = canvas.height;
  const block = 16;

  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      const ci = (y * w + x) * 4;
      if (m[ci] <= 128) continue;
      // Берём цвет из центра блока
      const cx = Math.min(x + block / 2, w - 1);
      const cy = Math.min(y + block / 2, h - 1);
      const si = (Math.floor(cy) * w + Math.floor(cx)) * 4;
      const r = d[si], g = d[si+1], b = d[si+2];
      // Заливаем весь блок
      for (let dy = 0; dy < block && y + dy < h; dy++) {
        for (let dx = 0; dx < block && x + dx < w; dx++) {
          const pi = ((y + dy) * w + (x + dx)) * 4;
          if (m[pi] > 128) {
            d[pi] = r; d[pi+1] = g; d[pi+2] = b;
          }
        }
      }
    }
  }
}

// ── Вспомогательные ──────────────────────────────────

function getLm(lm, idx, w, h) {
  return { x: lm[idx].x * w, y: lm[idx].y * h };
}

function stableCorners(p1, p2) {
  return p1.y < p2.y ? [p1, p2] : [p2, p1];
}

function lerpPt(a, b, t) {
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function lerpPts(cur, tgt, t) {
  return cur.map((p, i) => lerpPt(p, tgt[i], t));
}

function buildMask(pts) {
  const w = canvas.width, h = canvas.height;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const c = off.getContext("2d");
  c.fillStyle = "#fff";
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => c.lineTo(p.x, p.y));
  c.closePath();
  c.fill();
  return c.getImageData(0, 0, w, h);
}

function drawOverlay(pts, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.closePath();
  ctx.stroke();
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });
}

const DOT_COLORS = ["rgba(0,180,255,0.9)", "rgba(255,100,50,0.9)", "rgba(80,255,120,0.9)"];

// ── MediaPipe callback ────────────────────────────────

function onResults(results) {
  const w = canvas.width, h = canvas.height;

  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -w, 0, w, h);
  ctx.restore();

  const hands      = results.multiHandLandmarks;
  const handedness = results.multiHandedness;

  let leftLm  = null;
  let rightLm = null;

  if (hands && hands.length === 2) {
    for (let i = 0; i < hands.length; i++) {
      if (handedness[i].label === "Left")  rightLm = hands[i];
      else                                  leftLm  = hands[i];
    }
  }

  // Получаем общий кадр один раз
  const imageData = ctx.getImageData(0, 0, w, h);

  effects.forEach((eff, ei) => {
    const tag = document.getElementById(eff.id);
    const [f1, f2] = eff.fingers;

    let target = null;

    if (leftLm && rightLm) {
      const lP1 = getLm(leftLm,  f1, w, h);
      const lP2 = getLm(leftLm,  f2, w, h);
      const rP1 = getLm(rightLm, f1, w, h);
      const rP2 = getLm(rightLm, f2, w, h);

      const [lTop, lBot] = stableCorners(lP1, lP2);
      const [rTop, rBot] = stableCorners(rP1, rP2);
      target = [lTop, rTop, rBot, lBot];
    }

    if (target) {
      eff.lost = 0;
      eff.smooth = eff.smooth ? lerpPts(eff.smooth, target, LERP) : target;
      eff.last = [...eff.smooth];
      tag.className = "tag on";
    } else {
      eff.lost++;
      if (eff.lost < FADE_FRAMES && eff.last) {
        eff.smooth = eff.last;
      } else {
        eff.smooth = null;
        eff.last   = null;
      }
      tag.className = "tag";
    }

    if (eff.smooth) {
      const maskData = buildMask(eff.smooth);
      // Клонируем imageData чтобы эффекты не мешали друг другу
      const copy = new ImageData(new Uint8ClampedArray(imageData.data), w, h);
      eff.fn(copy, maskData);
      // Копируем только пиксели внутри маски обратно
      const src = copy.data;
      const dst = imageData.data;
      const m   = maskData.data;
      for (let i = 0; i < dst.length; i += 4) {
        if (m[i] > 128) {
          dst[i] = src[i]; dst[i+1] = src[i+1]; dst[i+2] = src[i+2];
        }
      }
    }
  });

  ctx.putImageData(imageData, 0, 0);

  // Рисуем контуры поверх
  effects.forEach((eff, ei) => {
    if (eff.smooth) drawOverlay(eff.smooth, DOT_COLORS[ei]);
  });
}

// ── Инициализация ─────────────────────────────────────

const handsDetector = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

handsDetector.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.4,
  minTrackingConfidence: 0.4,
});

handsDetector.onResults(onResults);

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      loop();
    };
  } catch(e) {
    alert("Camera error: " + e.message);
  }
}

async function loop() {
  await handsDetector.send({ image: video });
  requestAnimationFrame(loop);
}

startCamera();
</script>
</body>
</html>
