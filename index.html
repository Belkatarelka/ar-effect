<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #container { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    pointer-events: none;
  }
  #canvas {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #ui {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 10;
    pointer-events: none;
  }
  #status {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 16px;
    background: rgba(0,0,0,0.7);
    border-left: 3px solid #555;
    color: #aaa;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    border-radius: 0 8px 8px 0;
    font-weight: bold;
    pointer-events: none;
  }
  #status.active { color: #0f0; border-left-color: #0f0; }
  #status.pinch { background: rgba(0,255,0,0.2); color: #fff; }
  .controls-panel {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    padding: 12px;
    border-radius: 12px;
    z-index: 20;
    font-family: monospace;
    font-size: 11px;
    color: white;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }
  .controls-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .controls-panel input { width: 100px; cursor: pointer; }
  .controls-panel span { color: #0f0; }
</style>
</head>
<body>
<div id="container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="status">Starting camera...</div>
  </div>
  <div class="controls-panel">
    <label>Width: <input type="range" id="scaleX" min="1" max="8" step="0.1" value="3.5"></label>
    <label>Height: <input type="range" id="scaleY" min="1" max="8" step="0.1" value="3.5"></label>
    <span id="scaleVal">3.5 x 3.5</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video    = document.getElementById("video");
const canvas   = document.getElementById("canvas");
const ctx      = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const scaleXInput  = document.getElementById("scaleX");
const scaleYInput  = document.getElementById("scaleY");
const scaleValSpan = document.getElementById("scaleVal");

const LERP           = 0.7;
const FADE_FRAMES    = 8;
const PINCH_THRESH   = 0.06;
const PINCH_COOLDOWN = 20;
const FINGER_LERP    = 0.5;
const FINGER_TIPS    = [4, 8, 12, 16, 20];
const FINGER_NAMES   = ["T","I","M","R","P"];

const EFFECTS = ["none", "posterize", "threshold", "pixelate"];
const LABELS  = {
  none:      "NO EFFECT",
  posterize: "POSTERIZE",
  threshold: "THRESHOLD",
  pixelate:  "PIXELATE",
};

let currentEffect = 0;
let smoothPts     = null;
let lastPts       = null;
let lostFrames    = 0;
let pinchActive   = false;
let pinchCooldown = 0;
let cameraReady   = false;
let scaleX = 3.5;
let scaleY = 3.5;
let smoothLeftTips  = null;
let smoothRightTips = null;

scaleXInput.addEventListener("input", e => {
  scaleX = parseFloat(e.target.value);
  scaleValSpan.textContent = `${scaleX.toFixed(1)} x ${scaleY.toFixed(1)}`;
});
scaleYInput.addEventListener("input", e => {
  scaleY = parseFloat(e.target.value);
  scaleValSpan.textContent = `${scaleX.toFixed(1)} x ${scaleY.toFixed(1)}`;
});

// ── Эффекты ──────────────────────────────────────────

function applyPosterize(d, m) {
  const step = 255 / 3;
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      d[i]   = Math.round(Math.round(d[i]   / step) * step);
      d[i+1] = Math.round(Math.round(d[i+1] / step) * step);
      d[i+2] = Math.round(Math.round(d[i+2] / step) * step);
    }
  }
}

function applyThreshold(d, m) {
  for (let i = 0; i < d.length; i += 4) {
    if (m[i] > 128) {
      const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
      const val  = gray > 128 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = val;
    }
  }
}

function applyPixelate(d, m, w, h) {
  const block = 12;
  for (let y = 0; y < h; y += block) {
    for (let x = 0; x < w; x += block) {
      const ci = (y*w+x)*4;
      if (m[ci] <= 128) continue;
      const cx = Math.min(x+block/2, w-1);
      const cy = Math.min(y+block/2, h-1);
      const si = (Math.floor(cy)*w+Math.floor(cx))*4;
      const r=d[si], g=d[si+1], b=d[si+2];
      for (let dy=0; dy<block && y+dy<h; dy++)
        for (let dx=0; dx<block && x+dx<w; dx++) {
          const pi=((y+dy)*w+(x+dx))*4;
          if (m[pi]>128){d[pi]=r;d[pi+1]=g;d[pi+2]=b;}
        }
    }
  }
}

// ── Вспомогательные ──────────────────────────────────

function getLm(lm, idx, w, h) {
  // Координаты MediaPipe в нормализованном пространстве (без флипа)
  // Флипим X вручную чтобы совпало с отражённым видео
  return { x: (1 - lm[idx].x) * w, y: lm[idx].y * h };
}

function getLmRaw(lm, idx) {
  return { x: lm[idx].x, y: lm[idx].y };
}

function dist(a, b) {
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function getAllFingerTips(lm, w, h) {
  return FINGER_TIPS.map(idx => ({
    idx,
    x: (1 - lm[idx].x) * w,
    y: lm[idx].y * h,
  }));
}

function smoothTips(cur, tgt) {
  if (!cur) return tgt;
  return tgt.map((t,i) => ({
    idx: t.idx,
    x: cur[i].x*(1-FINGER_LERP) + t.x*FINGER_LERP,
    y: cur[i].y*(1-FINGER_LERP) + t.y*FINGER_LERP,
  }));
}

function drawJoints(lm, color, w, h) {
  const conn = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20]
  ];
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  conn.forEach(([a,b]) => {
    const p1 = getLm(lm, a, w, h);
    const p2 = getLm(lm, b, w, h);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  });
}

function drawTips(tips, color) {
  tips.forEach((t, i) => {
    ctx.beginPath();
    ctx.arc(t.x, t.y, 6, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 9px monospace";
    ctx.fillText(FINGER_NAMES[i], t.x-4, t.y-8);
  });
}

function getMaskPoints(thumb, index) {
  const cx = (thumb.x+index.x)/2;
  const cy = (thumb.y+index.y)/2;
  const fd = dist(thumb, index);
  const hw = fd*scaleX;
  const hh = fd*scaleY;
  return [
    {x:cx-hw, y:cy-hh},
    {x:cx+hw, y:cy-hh},
    {x:cx+hw, y:cy+hh},
    {x:cx-hw, y:cy+hh},
  ];
}

function lerpPt(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
function lerpPts(cur,tgt,t){ return cur.map((p,i)=>lerpPt(p,tgt[i],t)); }

function buildMask(pts) {
  const w=canvas.width, h=canvas.height;
  const off=document.createElement("canvas");
  off.width=w; off.height=h;
  const c=off.getContext("2d");
  c.fillStyle="#fff";
  c.beginPath();
  c.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>c.lineTo(p.x,p.y));
  c.closePath(); c.fill();
  return c.getImageData(0,0,w,h).data;
}

function drawOverlay(pts) {
  ctx.strokeStyle="rgba(255,255,255,0.9)";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke();
  pts.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,6,0,Math.PI*2);
    ctx.fillStyle="rgba(0,200,255,0.7)";
    ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke();
  });
}

// ── Главный callback ──────────────────────────────────

function onResults(results) {
  if (!cameraReady) return;
  const w=canvas.width, h=canvas.height;
  if (!w||!h) return;

  // Рисуем видео (флип через CSS на video теге, canvas рисуем напрямую)
  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(results.image,-w,0,w,h);
  ctx.restore();

  const hands      = results.multiHandLandmarks;
  const handedness = results.multiHandedness;

  // ── ПРАВИЛЬНОЕ определение рук после флипа ──
  // Видео зеркалим через CSS (scaleX(-1) на video теге)
  // MediaPipe получает оригинальный (незеркальный) поток
  // Поэтому: MediaPipe "Right" = правая рука пользователя (без инверсии)
  // Но координаты X нужно инвертировать (1 - x) чтобы совпасть с флипнутым видео
  let leftHand  = null;  // физически левая рука
  let rightHand = null;  // физически правая рука

  if (hands && hands.length >= 1) {
    for (let i=0; i<hands.length; i++) {
      const label = handedness[i].label;
      // MediaPipe "Right" → правая рука, "Left" → левая рука (всё правильно)
      if (label === "Right") rightHand = hands[i];
      else                   leftHand  = hands[i];
    }
  }

  // Рисуем скелеты
  if (leftHand) {
    drawJoints(leftHand, "rgba(0,200,255,0.35)", w, h);
    const raw = getAllFingerTips(leftHand, w, h);
    smoothLeftTips = smoothTips(smoothLeftTips, raw);
    drawTips(smoothLeftTips, "rgba(0,200,255,0.9)");
  } else {
    smoothLeftTips = null;
  }

  if (rightHand) {
    drawJoints(rightHand, "rgba(255,100,150,0.35)", w, h);
    const raw = getAllFingerTips(rightHand, w, h);
    smoothRightTips = smoothTips(smoothRightTips, raw);
    drawTips(smoothRightTips, "rgba(255,100,150,0.9)");
  } else {
    smoothRightTips = null;
  }

  // ── Маска и эффект ────────────────────────────────

  if (leftHand && rightHand) {
    const lThumb = getLm(leftHand,  4, w, h);
    const lIndex = getLm(leftHand,  8, w, h);
    const rThumb = getLm(rightHand, 4, w, h);
    const rIndex = getLm(rightHand, 8, w, h);

    // Щипок проверяем в raw координатах (без флипа)
    const lPinch = dist(getLmRaw(leftHand,4),  getLmRaw(leftHand,8))  < PINCH_THRESH;
    const rPinch = dist(getLmRaw(rightHand,4), getLmRaw(rightHand,8)) < PINCH_THRESH;
    const bothPinch = lPinch && rPinch;

    if (pinchCooldown>0) pinchCooldown--;
    if (bothPinch && !pinchActive && pinchCooldown===0) {
      currentEffect = (currentEffect+1) % EFFECTS.length;
      pinchActive   = true;
      pinchCooldown = PINCH_COOLDOWN;
    } else if (!bothPinch) {
      pinchActive = false;
    }

    const lMask = getMaskPoints(lThumb, lIndex);
    const rMask = getMaskPoints(rThumb, rIndex);
    const allPts = [...lMask, ...rMask];
    const minX = Math.min(...allPts.map(p=>p.x));
    const maxX = Math.max(...allPts.map(p=>p.x));
    const minY = Math.min(...allPts.map(p=>p.y));
    const maxY = Math.max(...allPts.map(p=>p.y));
    const target = [{x:minX,y:minY},{x:maxX,y:minY},{x:maxX,y:maxY},{x:minX,y:maxY}];

    lostFrames = 0;
    smoothPts  = smoothPts ? lerpPts(smoothPts, target, LERP) : target;
    lastPts    = [...smoothPts];

    const eff = EFFECTS[currentEffect];
    statusEl.textContent = LABELS[eff] + (bothPinch ? " [PINCH]" : "");
    statusEl.className   = eff!=="none" ? "active" : "";
    if (bothPinch) statusEl.classList.add("pinch");

  } else if (leftHand || rightHand) {
    const hand  = leftHand || rightHand;
    const thumb = getLm(hand, 4, w, h);
    const index = getLm(hand, 8, w, h);
    const target = getMaskPoints(thumb, index);

    lostFrames = 0;
    smoothPts  = smoothPts ? lerpPts(smoothPts, target, LERP) : target;
    lastPts    = [...smoothPts];

    statusEl.textContent = "ONE HAND — show both for effects";
    statusEl.className   = "";
  } else {
    lostFrames++;
    if (lostFrames < FADE_FRAMES && lastPts) smoothPts = lastPts;
    else { smoothPts = null; lastPts = null; }
    statusEl.textContent = "Show both hands";
    statusEl.className   = "";
  }

  const eff = EFFECTS[currentEffect];
  if (smoothPts && eff!=="none") {
    const imageData = ctx.getImageData(0,0,w,h);
    const mask = buildMask(smoothPts);
    if (eff==="posterize") applyPosterize(imageData.data, mask);
    if (eff==="threshold") applyThreshold(imageData.data, mask);
    if (eff==="pixelate")  applyPixelate(imageData.data, mask, w, h);
    ctx.putImageData(imageData,0,0);
    drawOverlay(smoothPts);
  } else if (smoothPts) {
    drawOverlay(smoothPts);
  }
}

// ── Инициализация ─────────────────────────────────────

const handsDetector = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

handsDetector.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5,
});

handsDetector.onResults(onResults);

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:"user", width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    return new Promise(resolve => {
      video.onloadedmetadata = () => {
        video.play().then(() => {
          const check = setInterval(() => {
            if (video.videoWidth > 0) {
              clearInterval(check);
              canvas.width  = video.videoWidth;
              canvas.height = video.videoHeight;
              cameraReady   = true;
              statusEl.textContent = "Show both hands";
              resolve();
            }
          }, 100);
        });
      };
    });
  } catch(e) {
    statusEl.textContent = "Camera error: " + e.message;
  }
}

async function loop() {
  if (cameraReady && video.readyState >= 2) {
    await handsDetector.send({ image: video });
  }
  requestAnimationFrame(loop);
}

startCamera().then(() => loop());
</script>
</body>
</html>
